name: Check Google Business Profile Rating Sync
on:
  schedule:
    # Runs every Sunday at 04:32 AM UTC
    - cron: '32 4 * * 0'
  workflow_dispatch:

jobs:
  check-rating:
    runs-on: ubuntu-latest
    
    # Set the default working directory for all run steps
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          # Explicitly tell GitHub where the lockfile is located
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute SerpApi rating sync check
        run: pnpm tsx scripts/check-gbp-rating.ts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
