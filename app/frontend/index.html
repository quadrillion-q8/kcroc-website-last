<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Static fallback defaults. Every route overrides these via
         SEOEngine.tsx (vite-react-ssg's <Head>) during SSG — these only
         show if that fails to run for a given page. -->
    <title>KCROC | Computer Repair Kuwait — Laptop, MacBook & PC Repair</title>
    <meta name="description" content="Expert laptop, MacBook and PC repair in Kuwait. Free pickup, 30-day warranty, same-day diagnostics. Hawalli-based repair lab serving all of Kuwait." />
    <meta name="robots" content="index, follow" />

    <!-- Favicons / manifest (matches files present in /public) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preconnects for the third parties allowed by the CSP in vercel.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
