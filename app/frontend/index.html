<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🩹 FIX (audit): this file used to hardcode <title>/<meta
         description>/<meta robots> here on the assumption that
         vite-react-ssg's per-page <Head> (see SEOEngine.tsx) would replace
         them during SSG. It doesn't — vite-react-ssg renders each page as a
         fragment into this exact template and APPENDS its extracted head
         tags rather than removing what's already here. The result: every
         one of the 62 prerendered pages shipped TWO <title> tags, TWO
         meta-description tags, and TWO meta-robots tags — the correct
         page-specific one plus this generic one, duplicated site-wide.
         Browsers happened to pick the first (correct) <title>/<meta
         description> in every page sampled, but duplicate tags are still
         invalid HTML, and Google explicitly may respond to duplicate/
         conflicting title, description, or robots signals by ignoring the
         provided value and generating its own — undermining every page's
         crafted SEO metadata. One page (a broken SEOEngine entityId
         reference, since fixed) even shipped a genuinely CONFLICTING
         robots pair (noindex vs index), which most search engines resolve
         by honoring the more restrictive value — i.e. that real, linked,
         sitemapped page was likely not being indexed at all.
         Since production is 100% statically prerendered (every route in
         sitemap.xml gets its own real title/description/robots baked in at
         build time — see vite.config.ts's includedRoutes), these static
         defaults are never actually needed there. Removed. The only cost
         is a blank browser-tab title for a fraction of a second during
         local `pnpm dev` (pure client-side, unbuilt) before React mounts —
         cosmetic, dev-only, and does not affect what search engines or
         production users ever see. -->

    <!-- Favicons / manifest (matches files present in /public) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090c0f" />

    <!-- Google tag (gtag.js) with Consent Mode v2.
         Defaults are DENIED; the cookie banner upgrades them via
         src/core/privacy/consent.ts. gtag MUST push the `arguments` object
         (not a rest-args array) or Google silently ignores every command. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      try {
        if (localStorage.getItem('kcroc-cookie-consent') === 'granted') {
          gtag('consent', 'update', {
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      } catch (e) {}
      gtag('js', new Date());
      // SPA: page_view is sent manually on route change (AnalyticsProvider).
      gtag('config', 'G-H2BXCZJ8NX', { send_page_view: false });
    </script>
    <script>
      (function () {
        var tagLoaded = false;
        var loadGoogleTag = function () {
          if (tagLoaded || document.getElementById('kcroc-google-tag')) return;
          tagLoaded = true;
          var script = document.createElement('script');
          script.id = 'kcroc-google-tag';
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-H2BXCZJ8NX';
          document.head.appendChild(script);
        };

        // Consent can be granted before idle; load immediately in that case.
        window.addEventListener('kcroc:consent-changed', function (event) {
          if (event && event.detail && event.detail.state === 'granted') loadGoogleTag();
        });

        // Otherwise keep the analytics library off the critical path.
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadGoogleTag, { timeout: 2500 });
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(loadGoogleTag, 1200);
        }, { once: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
