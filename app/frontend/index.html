<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🩹 FIX (audit): this file used to hardcode <title>/<meta
         description>/<meta robots> here on the assumption that
         vite-react-ssg's per-page <Head> (see SEOEngine.tsx) would replace
         them during SSG. It doesn't — vite-react-ssg renders each page as a
         fragment into this exact template and APPENDS its extracted head
         tags rather than removing what's already here. The result: every
         one of the 62 prerendered pages shipped TWO <title> tags, TWO
         meta-description tags, and TWO meta-robots tags — the correct
         page-specific one plus this generic one, duplicated site-wide.
         Browsers happened to pick the first (correct) <title>/<meta
         description> in every page sampled, but duplicate tags are still
         invalid HTML, and Google explicitly may respond to duplicate/
         conflicting title, description, or robots signals by ignoring the
         provided value and generating its own — undermining every page's
         crafted SEO metadata. One page (a broken SEOEngine entityId
         reference, since fixed) even shipped a genuinely CONFLICTING
         robots pair (noindex vs index), which most search engines resolve
         by honoring the more restrictive value — i.e. that real, linked,
         sitemapped page was likely not being indexed at all.
         Since production is 100% statically prerendered (every route in
         sitemap.xml gets its own real title/description/robots baked in at
         build time — see vite.config.ts's includedRoutes), these static
         defaults are never actually needed there. Removed. The only cost
         is a blank browser-tab title for a fraction of a second during
         local `pnpm dev` (pure client-side, unbuilt) before React mounts —
         cosmetic, dev-only, and does not affect what search engines or
         production users ever see. -->

    <!-- Favicons / manifest (matches files present in /public) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090c0f" />

    <!-- Google AdSense account ownership. This meta tag lets AdSense verify the
         site WITHOUT loading any ad code, so ads/cookies stay behind consent
         (see loadAdSense below). -->
    <meta name="google-adsense-account" content="ca-pub-9092827813961234" />

    <!-- Google Consent Mode v2 bootstrap. Keep the queue tiny and synchronous;
         the actual Google libraries are deferred until after the page has loaded
         so analytics/marketing code cannot compete with the homepage LCP. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      try {
        if (localStorage.getItem('kcroc-cookie-consent') === 'granted') {
          gtag('consent', 'update', {
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      } catch (e) {}
      gtag('js', new Date());
      // SPA pageviews remain manually dispatched by AnalyticsProvider.
      gtag('config', 'G-H2BXCZJ8NX', { send_page_view: false });
    </script>
    <script>
      (function () {
        var googleLoaded = false;
        var gtmLoaded = false;
        var adsenseLoaded = false;

        var loadScript = function (id, src) {
          if (document.getElementById(id)) return false;
          var script = document.createElement('script');
          script.id = id;
          script.async = true;
          script.src = src;
          document.head.appendChild(script);
          return true;
        };

        var loadGoogleTag = function () {
          if (googleLoaded || document.getElementById('kcroc-google-tag')) return;
          googleLoaded = loadScript('kcroc-google-tag', 'https://www.googletagmanager.com/gtag/js?id=G-H2BXCZJ8NX');
        };

        var loadGtm = function () {
          if (gtmLoaded || document.getElementById('kcroc-gtm')) return;
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          gtmLoaded = loadScript('kcroc-gtm', 'https://www.googletagmanager.com/gtm.js?id=GTM-5L7Z7D6K');
        };

        // Google AdSense is advertising, so it only loads once the visitor has
        // accepted optional technologies in the cookie banner (the same
        // 'granted' choice that enables ad_storage in Consent Mode). Without
        // consent no AdSense request is made at all.
        var hasAdvertisingConsent = function () {
          try { return localStorage.getItem('kcroc-cookie-consent') === 'granted'; } catch (e) { return false; }
        };

        var loadAdSense = function () {
          if (adsenseLoaded || !hasAdvertisingConsent() || document.getElementById('kcroc-adsense')) return;
          var script = document.createElement('script');
          script.id = 'kcroc-adsense';
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9092827813961234';
          document.head.appendChild(script);
          adsenseLoaded = true;
        };

        var scheduleAfterLoad = function (fn, idleTimeout) {
          var run = function () {
            if ('requestIdleCallback' in window) {
              window.requestIdleCallback(fn, { timeout: idleTimeout });
            } else {
              window.setTimeout(fn, idleTimeout);
            }
          };
          if (document.readyState === 'complete') run();
          else window.addEventListener('load', run, { once: true });
        };

        // Consent updates remain immediate; the network libraries wait until
        // after the initial page load/idle period.
        window.addEventListener('kcroc:consent-changed', function () {
          scheduleAfterLoad(loadGoogleTag, 2500);
          scheduleAfterLoad(loadGtm, 4500);
          scheduleAfterLoad(loadAdSense, 3500);
        });

        // Preserve analytics without putting GA/GTM/TikTok in the critical path.
        scheduleAfterLoad(loadGoogleTag, 2500);
        scheduleAfterLoad(loadGtm, 4500);
        scheduleAfterLoad(loadAdSense, 3500);
      })();
    </script>
    <!-- Google Tag Manager is intentionally loaded after the initial page load. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
