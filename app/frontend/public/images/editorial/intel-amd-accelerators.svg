<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">Ryzen AI compute and memory blocks</title><desc id="desc">CPU, integrated GPU and NPU communicate with system memory; compatible software selects the appropriate engine.</desc><rect width="800" height="600" rx="28" fill="#f4efe7"/><g font-family="system-ui,sans-serif" fill="#172022"><text x="40" y="62" font-size="31" font-weight="700">One platform, three engines</text><text x="40" y="100" font-size="19" fill="#566467">Conceptual architecture • not a physical die layout</text><g stroke="#397f77" stroke-width="3" fill="#fffdf9"><rect x="40" y="150" width="220" height="140" rx="17"/><rect x="290" y="150" width="220" height="140" rx="17"/><rect x="540" y="150" width="220" height="140" rx="17"/><rect x="100" y="380" width="600" height="112" rx="20"/></g><g text-anchor="middle"><text x="150" y="202" font-size="26" font-weight="700">Zen CPU</text><text x="150" y="235" font-size="17">General computing</text><text x="400" y="202" font-size="26" font-weight="700">RDNA GPU</text><text x="400" y="235" font-size="17">Graphics / parallel AI</text><text x="650" y="202" font-size="26" font-weight="700">XDNA NPU</text><text x="650" y="235" font-size="17">Supported inference</text><text x="400" y="426" font-size="26" font-weight="700">System memory</text><text x="400" y="457" font-size="18">Capacity and bandwidth shape workload limits</text></g><g stroke="#8f4f2c" stroke-width="4" fill="none"><path d="M150 290 V340 H400 V380"/><path d="M400 290 V380"/><path d="M650 290 V340 H400"/></g><text x="40" y="554" font-size="19" fill="#566467">Software and runtime determine which engine is used.</text></g></svg>