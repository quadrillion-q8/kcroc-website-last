<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Thermal throttling pattern"><rect width="800" height="600" fill="#fffdf8"/><rect width="800" height="10" fill="#b86e3c"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#283b40" text-anchor="start">Thermal throttling pattern</text><text x="38" y="102" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#526466" text-anchor="start">Illustrative trend only — no universal threshold.</text><rect x="62" y="150" width="676" height="300" rx="14" fill="#f8f5ee" stroke="#d6cec0"/><path d="M105 185 V410 H700" fill="none" stroke="#718080" stroke-width="2"/><path d="M110 360 C195 350 235 260 325 220 S470 200 700 200" fill="none" stroke="#b86e3c" stroke-width="7"/><path d="M110 265 C220 245 290 245 355 252 S470 350 700 350" fill="none" stroke="#397f77" stroke-width="7"/><path d="M365 170 V410" stroke="#687b7c" stroke-width="2" stroke-dasharray="8 8"/><text x="378" y="185" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#283b40" text-anchor="start">Limit may engage</text><text x="510" y="231" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a4b22" text-anchor="start">Temperature</text><text x="510" y="382" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24665f" text-anchor="start">Clock speed</text><text x="400" y="438" font-family="Arial,sans-serif" font-size="22" font-weight="500" fill="#526466" text-anchor="middle">Time under workload →</text><text x="70" y="492" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#283b40" text-anchor="start">Confirm with thermal / power limit flags.</text><path d="M38 548 L762 548" stroke="#d6cec0" stroke-width="2" fill="none" stroke-linecap="round"/><text x="38" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#526466" text-anchor="start">KCROC  /  TECHNICAL ILLUSTRATION</text><text x="762" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#526466" text-anchor="end">NOT MEASURED DATA</text></svg>