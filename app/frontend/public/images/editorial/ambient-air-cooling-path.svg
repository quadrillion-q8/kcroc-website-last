<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Cooling depends on intake air"><rect width="800" height="600" fill="#fffdf8"/><rect width="800" height="10" fill="#b86e3c"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#283b40" text-anchor="start">Cooling depends on intake air</text><text x="38" y="102" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#526466" text-anchor="start">Conceptual heat-transfer path in a laptop.</text><rect x="45" y="146" width="710" height="97" rx="14" fill="#e9f2ed" stroke="#d6cec0" stroke-width="2"/><text x="70" y="182" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#283b40" text-anchor="start">Cooler intake air</text><text x="70" y="217" font-family="Arial,sans-serif" font-size="22" font-weight="500" fill="#283b40" text-anchor="start">More room for heat transfer, all else equal.</text><rect x="45" y="267" width="710" height="97" rx="14" fill="#fcf0e2" stroke="#d6cec0" stroke-width="2"/><text x="70" y="303" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#283b40" text-anchor="start">Warmer intake air</text><text x="70" y="338" font-family="Arial,sans-serif" font-size="22" font-weight="500" fill="#283b40" text-anchor="start">Less thermal headroom under sustained load.</text><rect x="45" y="388" width="710" height="114" rx="14" fill="#f5f1e9" stroke="#d6cec0" stroke-width="2"/><text x="70" y="425" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#283b40" text-anchor="start">CPU / GPU → heatsink → exhaust</text><text x="70" y="461" font-family="Arial,sans-serif" font-size="22" font-weight="500" fill="#283b40" text-anchor="start">Fans, airflow and power limits also matter.</text><path d="M38 548 L762 548" stroke="#d6cec0" stroke-width="2" fill="none" stroke-linecap="round"/><text x="38" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#526466" text-anchor="start">KCROC  /  TECHNICAL ILLUSTRATION</text><text x="762" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#526466" text-anchor="end">NOT MEASURED DATA</text></svg>