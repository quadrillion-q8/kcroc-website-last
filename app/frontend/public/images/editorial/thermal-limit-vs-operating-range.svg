<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Operating range ≠ thermal limit"><rect width="800" height="600" fill="#fffdf8"/><rect width="800" height="10" fill="#b86e3c"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#283b40" text-anchor="start">Operating range ≠ thermal limit</text><text x="38" y="102" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#526466" text-anchor="start">Always check the exact processor specification.</text><rect x="45" y="151" width="710" height="162" rx="14" fill="#f5f1e9" stroke="#d6cec0" stroke-width="2"/><text x="70" y="186" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#283b40" text-anchor="start">Operating range</text><text x="70" y="223" font-family="Arial,sans-serif" font-size="23" font-weight="500" fill="#283b40" text-anchor="start">Varies with workload, cooling and power.</text><rect x="70" y="251" width="490" height="25" rx="12" fill="#4f8d83"/><rect x="567" y="251" width="161" height="25" rx="12" fill="#ead8bb"/><rect x="45" y="337" width="710" height="161" rx="14" fill="#fcf0e2" stroke="#d6cec0" stroke-width="2"/><text x="70" y="377" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#283b40" text-anchor="start">Model-specific thermal ceiling</text><text x="70" y="414" font-family="Arial,sans-serif" font-size="23" font-weight="500" fill="#283b40" text-anchor="start">Controls may reduce clock speed or power.</text><text x="70" y="453" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#283b40" text-anchor="start">A high reading alone does not prove a fault.</text><path d="M38 548 L762 548" stroke="#d6cec0" stroke-width="2" fill="none" stroke-linecap="round"/><text x="38" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#526466" text-anchor="start">KCROC  /  TECHNICAL ILLUSTRATION</text><text x="762" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#526466" text-anchor="end">NOT MEASURED DATA</text></svg>