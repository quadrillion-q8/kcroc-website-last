<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A repeatable temperature test"><rect width="800" height="600" fill="#fffdf8"/><rect width="800" height="10" fill="#b86e3c"/><text x="38" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#283b40" text-anchor="start">A repeatable temperature test</text><text x="38" y="102" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#526466" text-anchor="start">Use the same tool and comparable conditions.</text><rect x="45" y="133" width="710" height="76" rx="14" fill="#f5f1e9" stroke="#d6cec0" stroke-width="2"/><text x="68" y="162" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#283b40" text-anchor="start">1  Idle baseline</text><text x="68" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#283b40" text-anchor="start">Let the system settle; record utilization.</text><path d="M400 210 L400 232" stroke="#b86e3c" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="45" y="233" width="710" height="76" rx="14" fill="#f5f1e9" stroke="#d6cec0" stroke-width="2"/><text x="68" y="262" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#283b40" text-anchor="start">2  Everyday workload</text><text x="68" y="290" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#283b40" text-anchor="start">Record sustained temperature and clocks.</text><path d="M400 310 L400 332" stroke="#b86e3c" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="45" y="333" width="710" height="76" rx="14" fill="#f5f1e9" stroke="#d6cec0" stroke-width="2"/><text x="68" y="362" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#283b40" text-anchor="start">3  Problem workload</text><text x="68" y="390" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#283b40" text-anchor="start">Reproduce the symptom if safe.</text><path d="M400 410 L400 432" stroke="#b86e3c" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="45" y="433" width="710" height="76" rx="14" fill="#e9f2ed" stroke="#d6cec0" stroke-width="2"/><text x="68" y="462" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#283b40" text-anchor="start">4  Compare</text><text x="68" y="490" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#283b40" text-anchor="start">Check trends, performance and limit flags.</text><path d="M38 548 L762 548" stroke="#d6cec0" stroke-width="2" fill="none" stroke-linecap="round"/><text x="38" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#526466" text-anchor="start">KCROC  /  TECHNICAL ILLUSTRATION</text><text x="762" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#526466" text-anchor="end">NOT MEASURED DATA</text></svg>